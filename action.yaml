name: Bookmarklet Generator
description: Generate an install page or update a bookmarklet link on an existing page.
branding:
  color: blue
  icon: link
inputs:
  source_js_file:
    description: JavaScript source file
    default: src/bookmarklet.js
  target_html_file:
    description: Install page to create or update
    default: index.html
  target_element_id:
    description: Install link ID
    default: target
  commit_message:
    description: Commit message for a changed page
    default: Update bookmarklet link
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SOURCE_FILE: ${{ inputs.source_js_file }}
        TARGET_FILE: ${{ inputs.target_html_file }}
        TARGET_ID: ${{ inputs.target_element_id }}
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
      run: |
        work=$(mktemp -d)
        trap 'rm -rf "$work"' EXIT
        # The wrapper supports both plain scripts and existing IIFEs.
        { printf '(function(){\n'; cat -- "$SOURCE_FILE"; printf '\n})();\n'; } > "$work/input.js"
        npm exec --yes --package=uglify-js@3.19.3 -- uglifyjs "$work/input.js" -c -m -o "$work/min.js"
        python3 "$GITHUB_ACTION_PATH/scripts/generate.py" "$work/min.js"
        git add -- "$TARGET_FILE"
        if ! git diff --cached --quiet -- "$TARGET_FILE"; then
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m "$COMMIT_MESSAGE" -- "$TARGET_FILE"
          git push
        fi
